# 一键部署：前端(nginx) + 后端(Express)，单域名对外，无需配置 CORS
# 使用：
#   1) cp .env.example .env 并按需修改（JWT_SECRET 必改）
#   2) docker compose up -d --build
#   3) 浏览器访问 http://服务器IP
# 说明：前端与 /api 走同一域名（80 端口），nginx 把 /api、/uploads 转发给 server，
#      因此不要设置 VITE_API_BASE_URL，保持同源可彻底避免跨域问题。
services:
  server:
    build: ./server
    restart: always
    # 仅容器网络内可访问；如需本地调试可临时加 "127.0.0.1:8080:8080"
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      JWT_SECRET: "${JWT_SECRET:?请先在 .env 中设置 JWT_SECRET}"
      # 同源部署下无需跨域白名单；如另行分离部署前端，再填写前端域名（逗号分隔）
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      AI_BASE_URL: "${AI_BASE_URL:-https://api.openai.com/v1}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-gpt-4o-mini}"
      AI_CONFIDENCE_THRESHOLD: "${AI_CONFIDENCE_THRESHOLD:-0.7}"
    volumes:
      - server-data:/app/data        # SQLite 数据库持久化
      - server-uploads:/app/uploads  # 上传材料持久化
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./web
      args:
        # 留空 = 与页面同源（推荐）。若前后端分开部署，填后端公网地址，如 https://api.example.com
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  server-data:
  server-uploads:
